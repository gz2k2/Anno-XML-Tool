name: Build and Release (Dropbox Upload)

on:
  push:
    branches:
      - main
    tags:
      - 'db*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, 'v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pyinstaller google-api-python-client google-auth

      - name: Read Version and Changelog
        id: get_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "version.txt")) {
              throw "Die Datei version.txt wurde nicht gefunden."
          }

          $version = (Get-Content "version.txt" -Raw).Trim()

          if (-not $version) {
              throw "Die Datei version.txt enthält keine Versionsnummer."
          }

          "VERSION=$version" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          if (Test-Path "changelog.md") {
              $changelog = Get-Content "changelog.md" -Raw
          }
          else {
              $changelog = "Kein Changelog vorhanden."
          }

          "CHANGELOG<<CHANGELOG_END" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          $changelog | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "CHANGELOG_END" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Ermittelte Version: $version"

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ steps.get_version.outputs.VERSION }}"
          $exeName = "Anno_XML_Viewer_v$version"
          $exePath = "dist\$exeName.exe"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --icon "data/ui/AnnoXMLTool.ico" `
            --name "$exeName" `
            --add-data "data/ui/kofi5.webp;data/ui" `
            --add-data "version.txt;." `
            --add-data "data/ui/AnnoXMLTool.ico;data/ui" `
            "Anno_XML_Viewer.py"

          if ($LASTEXITCODE -ne 0) {
              throw "PyInstaller ist fehlgeschlagen. Exitcode: $LASTEXITCODE"
          }

          if (-not (Test-Path $exePath)) {
              throw "Die erwartete EXE wurde nicht erstellt: $exePath"
          }

          $exeFile = Get-Item $exePath

          Write-Host "Build erfolgreich."
          Write-Host "Datei: $($exeFile.FullName)"
          Write-Host "Größe in Byte: $($exeFile.Length)"

      - name: Upload to Dropbox
        shell: pwsh
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          $file = "dist\Anno_XML_Viewer_v$env:VERSION.exe"

          if (-not (Test-Path $file)) {
              throw "Datei nicht gefunden: $file"
          }

          # 1. Frischen Access Token über den Refresh Token anfordern
          $tokenResponse = Invoke-RestMethod -Uri "https://api.dropboxapi.com/oauth2/token" `
              -Method Post `
              -ContentType "application/x-www-form-urlencoded" `
              -Body @{
                  grant_type    = "refresh_token"
                  refresh_token = $env:DROPBOX_REFRESH_TOKEN
                  client_id     = $env:DROPBOX_APP_KEY
                  client_secret = $env:DROPBOX_APP_SECRET
              }

          $accessToken = $tokenResponse.access_token

          if ([string]::IsNullOrWhiteSpace($accessToken)) {
              throw "Konnte keinen Access Token von Dropbox beziehen."
          }

          # 2. Upload durchführen
          $dropboxPath = "/Anno_XML_Viewer/Anno_XML_Viewer_v$env:VERSION.exe"

          Write-Host "Upload von:"
          Write-Host $file
          Write-Host ""
          Write-Host "nach Dropbox:"
          Write-Host $dropboxPath

          $arg = @{
              path       = $dropboxPath
              mode       = "overwrite"
              autorename = $false
              mute       = $false
          } | ConvertTo-Json -Compress

          curl.exe `
            -X POST "https://content.dropboxapi.com/2/files/upload" `
            --header "Authorization: Bearer $accessToken" `
            --header "Dropbox-API-Arg: $arg" `
            --header "Content-Type: application/octet-stream" `
            --data-binary "@$file"

          if ($LASTEXITCODE -ne 0) {
              throw "Dropbox Upload fehlgeschlagen."
          }

          Write-Host "Upload erfolgreich abgeschlossen."