name: Build and Release (Dropbox Upload test)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, 'v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pyinstaller google-api-python-client google-auth

      - name: Read Version and Changelog
        id: get_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "version.txt")) {
              throw "Die Datei version.txt wurde nicht gefunden."
          }

          $version = (Get-Content "version.txt" -Raw).Trim()

          if (-not $version) {
              throw "Die Datei version.txt enthält keine Versionsnummer."
          }

          "VERSION=$version" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          if (Test-Path "changelog.md") {
              $changelog = Get-Content "changelog.md" -Raw
          }
          else {
              $changelog = "Kein Changelog vorhanden."
          }

          "CHANGELOG<<CHANGELOG_END" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          $changelog | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "CHANGELOG_END" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Ermittelte Version: $version"

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ steps.get_version.outputs.VERSION }}"
          $exeName = "Anno_XML_Viewer_v$version"
          $exePath = "dist\$exeName.exe"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --icon "data/ui/AnnoXMLTool.ico" `
            --name "$exeName" `
            --add-data "data/ui/kofi5.webp;data/ui" `
            --add-data "version.txt;." `
            --add-data "data/ui/AnnoXMLTool.ico;data/ui" `
            "Anno_XML_Viewer.py"

          if ($LASTEXITCODE -ne 0) {
              throw "PyInstaller ist fehlgeschlagen. Exitcode: $LASTEXITCODE"
          }

          if (-not (Test-Path $exePath)) {
              throw "Die erwartete EXE wurde nicht erstellt: $exePath"
          }

          $exeFile = Get-Item $exePath

          Write-Host "Build erfolgreich."
          Write-Host "Datei: $($exeFile.FullName)"
          Write-Host "Größe in Byte: $($exeFile.Length)"

      - name: Upload to Dropbox
        shell: pwsh
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          DROPBOX_FOLDER: /Anno_XML_Viewer_test
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:DROPBOX_APP_KEY) {
              throw "GitHub Secret DROPBOX_APP_KEY fehlt."
          }

          if (-not $env:DROPBOX_APP_SECRET) {
              throw "GitHub Secret DROPBOX_APP_SECRET fehlt."
          }

          if (-not $env:DROPBOX_REFRESH_TOKEN) {
              throw "GitHub Secret DROPBOX_REFRESH_TOKEN fehlt."
          }

          if (-not $env:VERSION) {
              throw "Die Versionsnummer fehlt."
          }

          $fileName = "Anno_XML_Viewer_v$env:VERSION.exe"
          $localFile = "dist\$fileName"

          if (-not (Test-Path $localFile)) {
              throw "Die Datei wurde nicht gefunden: $localFile"
          }

          $dropboxFolder = $env:DROPBOX_FOLDER.Trim()

          if (-not $dropboxFolder.StartsWith("/")) {
              $dropboxFolder = "/$dropboxFolder"
          }

          $dropboxFolder = $dropboxFolder.TrimEnd("/")
          $dropboxPath = "$dropboxFolder/$fileName"

          Write-Host "Lokale Datei: $localFile"
          Write-Host "Dropbox-Ziel: $dropboxPath"

          $tokenResponseFile = Join-Path `
              $env:RUNNER_TEMP `
              "dropbox-token-response.json"

          $uploadResponseFile = Join-Path `
              $env:RUNNER_TEMP `
              "dropbox-upload-response.json"

          try {
              Write-Host "Fordere Dropbox Access Token an ..."

              $tokenHttpCode = curl.exe `
                  --silent `
                  --show-error `
                  --output "$tokenResponseFile" `
                  --write-out "%{http_code}" `
                  --request POST `
                  --user "$($env:DROPBOX_APP_KEY):$($env:DROPBOX_APP_SECRET)" `
                  --header "Content-Type: application/x-www-form-urlencoded" `
                  --data-urlencode "grant_type=refresh_token" `
                  --data-urlencode "refresh_token=$env:DROPBOX_REFRESH_TOKEN" `
                  "https://api.dropboxapi.com/oauth2/token"

              if ($LASTEXITCODE -ne 0) {
                  throw "curl konnte keinen Access Token anfordern. Exitcode: $LASTEXITCODE"
              }

              if ($tokenHttpCode -ne "200") {
                  $tokenError = Get-Content $tokenResponseFile -Raw
                  throw "Dropbox Token-Anfrage fehlgeschlagen. HTTP-Code: $tokenHttpCode. Antwort: $tokenError"
              }

              $tokenResponse = Get-Content $tokenResponseFile -Raw |
                  ConvertFrom-Json

              $accessToken = $tokenResponse.access_token

              if (-not $accessToken) {
                  throw "Dropbox hat keinen Access Token zurückgegeben."
              }

              Write-Host "Access Token wurde erfolgreich erstellt."

              $dropboxArgumentObject = @{
                  path            = $dropboxPath
                  mode            = "overwrite"
                  autorename      = $false
                  mute            = $false
                  strict_conflict = $false
              }

              $dropboxApiArgument = $dropboxArgumentObject |
                  ConvertTo-Json -Compress

              Write-Host "Starte Dropbox-Upload ..."

              $uploadHttpCode = curl.exe `
                  --silent `
                  --show-error `
                  --output "$uploadResponseFile" `
                  --write-out "%{http_code}" `
                  --request POST `
                  --header "Authorization: Bearer $accessToken" `
                  --header "Dropbox-API-Arg: $dropboxApiArgument" `
                  --header "Content-Type: application/octet-stream" `
                  --data-binary "@$localFile" `
                  "https://content.dropboxapi.com/2/files/upload"

              if ($LASTEXITCODE -ne 0) {
                  throw "curl konnte die Datei nicht hochladen. Exitcode: $LASTEXITCODE"
              }

              if ($uploadHttpCode -ne "200") {
                  $uploadError = Get-Content $uploadResponseFile -Raw
                  throw "Dropbox-Upload fehlgeschlagen. HTTP-Code: $uploadHttpCode. Antwort: $uploadError"
              }

              $uploadResponse = Get-Content $uploadResponseFile -Raw |
                  ConvertFrom-Json

              Write-Host "Dropbox-Upload erfolgreich."
              Write-Host "Dropbox-Pfad: $($uploadResponse.path_display)"
              Write-Host "Dropbox-ID: $($uploadResponse.id)"
              Write-Host "Revision: $($uploadResponse.rev)"
          }
          finally {
              if (Test-Path $tokenResponseFile) {
                  Remove-Item $tokenResponseFile -Force
              }

              if (Test-Path $uploadResponseFile) {
                  Remove-Item $uploadResponseFile -Force
              }

              $accessToken = $null
          }