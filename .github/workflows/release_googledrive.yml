name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger bei Tags wie v1.0, v0.1.0-beta, etc.
  workflow_dispatch: # Ermöglicht das manuelle Starten über die GitHub-Webseite

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'v')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller google-api-python-client google-auth

      - name: Read Version and Changelog
        id: get_version
        shell: pwsh
        run: |
          $v = Get-Content version.txt -Raw
          echo "VERSION=$($v.Trim())" >> $env:GITHUB_OUTPUT
          
          # Read changelog and handle multiline output for GitHub Actions
          $changelog = Get-Content changelog.md -Raw
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo $changelog >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon "data/ui/AnnoXMLTool.ico" --name "Anno_XML_Viewer_v${{ steps.get_version.outputs.VERSION }}" --add-data "data/ui/kofi5.webp;data/ui" --add-data "version.txt;." --add-data "data/ui/AnnoXMLTool.ico;data/ui" Anno_XML_Viewer.py

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Anno_XML_Viewer_v${{ steps.get_version.outputs.VERSION }}.exe
          name: ${{ github.ref_type == 'tag' && format('v{0}', steps.get_version.outputs.VERSION) || format('v{0}', steps.get_version.outputs.VERSION) }}
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          body: |
            Automatic build of version ${{ steps.get_version.outputs.VERSION }}.

            ${{ steps.get_version.outputs.CHANGELOG }}

            ### Changes
            See the automatic release notes below or the commit history.
            
            ### Download
            You can find the executable file in the Assets section below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Google Drive Upload via Python ---
      - name: Create Upload Script
        shell: bash
        run: |
          cat << 'EOF' > upload_gdrive.py
          import os, glob, json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_data = json.loads(os.environ["GCP_SA_KEY"])
          creds = Credentials.from_service_account_info(creds_data, scopes=["https://www.googleapis.com/auth/drive.file"])
          service = build("drive", "v3", credentials=creds)

          version = os.environ.get("VERSION", "")
          pattern = f"dist/Anno_XML_Viewer_v{version}.exe"
          files = glob.glob(pattern)

          print(f"Suche nach: {pattern}")
          print(f"Gefundene Dateien: {files}")

          if not files:
              raise FileNotFoundError(f"Keine Datei für Muster '{pattern}' im Verzeichnis '{os.getcwd()}' gefunden!")

          for file_path in files:
              file_name = os.path.basename(file_path)
              print(f"Lade hoch: {file_name}...")
              file_metadata = {
                  "name": file_name,
                  "parents": [os.environ["FOLDER_ID"]]
              }
              media = MediaFileUpload(file_path, resumable=True)
              file = service.files().create(body=file_metadata, media_body=media, fields="id").execute()
              print(f"Erfolgreich hochgeladen! File-ID: {file.get('id')}")
          EOF

      - name: Upload to Google Drive
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FOLDER_ID: "10XrGH5rX77B2yzeypwuCCxvQedYd2iif"
          VERSION: "${{ steps.get_version.outputs.VERSION }}"
        run: |
          python upload_gdrive.py