name: Build and Release (Dropbox Upload test)

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger bei Tags wie v1.0, v0.1.0-beta, etc.
  workflow_dispatch: # Ermöglicht das manuelle Starten über die GitHub-Webseite

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'v')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller google-api-python-client google-auth

      - name: Read Version and Changelog
        id: get_version
        shell: pwsh
        run: |
          $v = Get-Content version.txt -Raw
          echo "VERSION=$($v.Trim())" >> $env:GITHUB_OUTPUT
          
          # Read changelog and handle multiline output for GitHub Actions
          $changelog = Get-Content changelog.md -Raw
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo $changelog >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon "data/ui/AnnoXMLTool.ico" --name "Anno_XML_Viewer_v${{ steps.get_version.outputs.VERSION }}" --add-data "data/ui/kofi5.webp;data/ui" --add-data "version.txt;." --add-data "data/ui/AnnoXMLTool.ico;data/ui" Anno_XML_Viewer.py

      - name: Upload to Dropbox
        shell: pwsh
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          $file = "dist\Anno_XML_Viewer_v$env:VERSION.exe"

          if (-not (Test-Path $file)) {
              throw "Datei nicht gefunden: $file"
          }

          $dropboxPath = "/Anno_XML_Viewer/Anno_XML_Viewer_v$env:VERSION.exe"

          Write-Host "Upload von:"
          Write-Host $file
          Write-Host ""
          Write-Host "nach Dropbox:"
          Write-Host $dropboxPath

          $arg = @{
              path = $dropboxPath
              mode = "overwrite"
              autorename = $false
              mute = $false
          } | ConvertTo-Json -Compress

          curl.exe `
            -X POST "https://content.dropboxapi.com/2/files/upload" `
            --header "Authorization: Bearer $env:DROPBOX_TOKEN" `
            --header "Dropbox-API-Arg: $arg" `
            --header "Content-Type: application/octet-stream" `
            --data-binary "@$file"

          if ($LASTEXITCODE -ne 0) {
              throw "Dropbox Upload fehlgeschlagen."
          }

          Write-Host "Upload erfolgreich abgeschlossen."