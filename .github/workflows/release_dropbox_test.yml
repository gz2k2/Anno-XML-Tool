name: Build and Release (Dropbox Upload)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, 'v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller google-api-python-client google-auth dropbox

      - name: Read Version and Changelog
        id: get_version
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()

          if ([string]::IsteSpace($version)) {
              throw "version.txt enthält keine gültige Versionsnummer."
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT

          if (Test-Path "changelog.md") {
              $changelog = Get-Content changelog.md -Raw
          }
          else {
              $changelog = "Kein Changelog vorhanden."
          }

          "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          $changelog >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          Write-Host "Version: $version"

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"

          pyinstaller `
            --onefile `
            --windowed `
            --icon "data/ui/AnnoXMLTool.ico" `
            --name "Anno_XML_Viewer_v$version" `
            --add-data "data/ui/kofi5.webp;data/ui" `
            --add-data "version.txt;." `
            --add-data "data/ui/AnnoXMLTool.ico;data/ui" `
            Anno_XML_Viewer.py

          $exe = "dist\Anno_XML_Viewer_v$version.exe"

          if (-not (Test-Path $exe)) {
              throw "Build fehlgeschlagen. Datei nicht gefunden: $exe"
          }

          Write-Host "EXE erfolgreich erstellt: $exe"

#      - name: Create Release
#        id: create_release
#        uses: softprops/action-gh-release@v2
#        with:
#          files: dist/Anno_XML_Viewer_v${{ steps.get_version.outputs.VERSION }}.exe
#          name: v${{ steps.get_version.outputs.VERSION }}
#          tag_name: v${{ steps.get_version.outputs.VERSION }}
#          draft: false
#          prerelease: ${{ github.ref_type != 'tag' }}
#          generate_release_notes: true
#          body: |
#            Automatic build of version ${{ steps.get_version.outputs.VERSION }}.
#
#            ${{ steps.get_version.outputs.CHANGELOG }}
#
#            ### Changes
#            See the automatic release notes below or the commit history.
#
#            ### Download
#            You can find the executable file in the Assets section below.
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Dropbox
        shell: pwsh
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          DROPBOX_FOLDER: /Anno_XML_Viewer
        run: |
          @'
          import os
          from pathlib import Path

          import dropbox
          from dropbox.files import WriteMode

          token = os.environ["DROPBOX_TOKEN"]
          version = os.environ["VERSION"]
          folder = os.environ["DROPBOX_FOLDER"]

          filename = f"Anno_XML_Viewer_v{version}.exe"
          local_file = Path("dist") / filename

          if not local_file.exists():
              raise FileNotFoundError(
                  f"Datei nicht gefunden: {local_file}"
              )

          dbx = dropbox.Dropbox(token)

          remote_file = f"{folder}/{filename}"

          print(f"Upload: {local_file}")
          print(f"Nach Dropbox: {remote_file}")

          with open(local_file, "rb") as f:
              dbx.files_upload(
                  f.read(),
                  remote_file,
                  mode=WriteMode.overwrite
              )

          print("Upload erfolgreich abgeschlossen.")
          '@ | Set-Content upload_to_dropbox.py

          python upload_to_dropbox.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anno_XML_Viewer_v${{ steps.get_version.outputs.VERSION }}
          path: dist/Anno_XML_Viewer_v${{ steps.get_version.outputs.VERSION }}.exe
          if-no-files-found: error
          retention-days: 30